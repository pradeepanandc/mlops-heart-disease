

name: Heart Disease MLOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docker.txt
          pip install pytest httpx mlflow matplotlib seaborn


      - name: Check Python syntax
        run: python -m compileall -q src tests

      - name: Run API tests
        run: python -m pytest tests/test_api.py -v

      - name: Train and evaluate models
        run: python src/train_models.py

      - name: Upload training artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heart-disease-training-results
          path: |
            results/
            models/heart_disease_model.joblib
          if-no-files-found: warn
          retention-days: 7
